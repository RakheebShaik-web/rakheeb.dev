name: Refresh project updated dates

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest commit date per project repo and patch main.jsx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request, datetime, pathlib
          import os
          repos = ["alpaca.bot-eod-dashboard", "stocks-options-strategy", "quant-screener"]
          token = os.environ["GH_TOKEN"]
          p = pathlib.Path("src/main.jsx")
          src = p.read_text()
          for repo in repos:
              url = f"https://api.github.com/repos/RakheebShaik-web/{repo}"
              req = urllib.request.Request(url, headers={
                  "User-Agent": "date-refresher",
                  "Authorization": f"Bearer {token}",
              })
              try:
                  data = json.load(urllib.request.urlopen(req, timeout=15))
                  dt = datetime.datetime.fromisoformat(data["pushed_at"].replace("Z", "+00:00"))
                  stamp = dt.strftime("%b %d %Y").upper().replace(" 0", " ")
                  src = re.sub(
                    rf'(title: "{re.escape(data["name"])}".*?updated: ")[A-Z]{{3}} \d{{1,2}} \d{{4}}',
                    rf'\g<1>{stamp}',
                    src, flags=re.S)
                  print(f"{repo}: {stamp}")
              except Exception as e:
                  print(f"{repo}: skipped ({e})")
          p.write_text(src)
          EOF
      - name: Commit if changed
        run: |
          git config user.name "date-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet || (git commit -am "chore: refresh project updated dates" && git push)
